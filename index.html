<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Vy’s Grammar Path · Unit 1–4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --bg:#fbf9ff; --surface:#ffffff; --ink:#2b2452; --muted:#7b7499; --line:#ece6fb;
  --brand:#8466ff; --brand-ink:#ffffff; --brand-deep:#5b3fd8; --brand-soft:#f1ecff; --brand-shadow:#6a4ce6;
  --ok:#34b873; --ok-deep:#21945a; --ok-soft:#e4f8ed;
  --warn:#ff8a6b; --warn-deep:#e4603f; --warn-soft:#fff1ec;
  --s-bg:#ffe0dc; --s-ink:#d6392e; --v-bg:#dde9ff; --v-ink:#2f63d6; --a-bg:#d8f5e3; --a-ink:#1f8a50; --j-bg:#fff0b3; --j-ink:#8a6400;
  --t0:#f1ebff; --t1:#e1f6ec; --t2:#ffede2; --t3:#e2efff; --t4:#fff4d4; --t5:#ffe7f0;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171228; --surface:#211a38; --ink:#f1ecff; --muted:#aaa2cc; --line:#352c5c;
  --brand:#9a80ff; --brand-ink:#171228; --brand-deep:#c8b8ff; --brand-soft:#2c2350; --brand-shadow:#6a4ce6;
  --ok:#4fd08c; --ok-deep:#8ee8b6; --ok-soft:#1b3f2d; --warn:#ff9a7e; --warn-deep:#ffb39e; --warn-soft:#45261f;
  --s-bg:#5a201c; --s-ink:#ffb9b1; --v-bg:#1c315f; --v-ink:#abc7ff; --a-bg:#16452b; --a-ink:#a2e9bb; --j-bg:#55470f; --j-ink:#ffe27c;
  --t0:#ece4ff; --t1:#ddf3e8; --t2:#ffe9dc; --t3:#deebff; --t4:#fff1cc; --t5:#ffe2ee; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171228; --surface:#211a38; --ink:#f1ecff; --muted:#aaa2cc; --line:#352c5c;
  --brand:#9a80ff; --brand-ink:#171228; --brand-deep:#c8b8ff; --brand-soft:#2c2350; --brand-shadow:#6a4ce6;
  --ok:#4fd08c; --ok-deep:#8ee8b6; --ok-soft:#1b3f2d; --warn:#ff9a7e; --warn-deep:#ffb39e; --warn-soft:#45261f;
  --s-bg:#5a201c; --s-ink:#ffb9b1; --v-bg:#1c315f; --v-ink:#abc7ff; --a-bg:#16452b; --a-ink:#a2e9bb; --j-bg:#55470f; --j-ink:#ffe27c;
  --t0:#ece4ff; --t1:#ddf3e8; --t2:#ffe9dc; --t3:#deebff; --t4:#fff1cc; --t5:#ffe2ee; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.55 Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:12px 18px 130px;min-height:100vh}
h1,h2,h3{font-family:"Baloo 2",Nunito,system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg{display:block}
i{font-style:italic}

/* grammar colours */
.g{border-radius:7px;padding:0 .16em;font-weight:600;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.g-s{background:var(--s-bg);color:var(--s-ink)} .g-v{background:var(--v-bg);color:var(--v-ink)} .g-a{background:var(--a-bg);color:var(--a-ink)} .g-j{background:var(--j-bg);color:var(--j-ink)}
.g-u{background:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600;padding:0}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:14px}
.legend .g{padding:3px 10px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.lg{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:9px 12px}
.lg .key{display:grid;place-items:center;min-width:42px;height:38px;border-radius:12px;font-weight:700;font-size:15px}
.lg b{display:block;font-weight:600;font-size:16px;line-height:1.2}.lg small{color:var(--muted);font-size:13px}

/* tiles */
.tile{display:inline-grid;place-items:center;background:var(--t0);border-radius:18px;flex:none;position:relative}
.tile svg{width:76%;height:76%}
.tile.sm{width:46px;height:46px;border-radius:14px}
.tile.lg{width:100px;height:100px;border-radius:28px}.tile.xl{width:140px;height:140px;border-radius:36px}
.tile.qbig{width:120px;height:100px;border-radius:26px}
.tile.qbig svg{width:76px;height:76px}
.spark{position:absolute;border-radius:50%;background:#fff;opacity:.9}
.spark.s1{width:9px;height:9px;top:12px;right:14px}.spark.s2{width:6px;height:6px;bottom:16px;left:14px;opacity:.7}
.tip{color:var(--muted);font-size:15px;margin:10px 0}
.tip.center,.center{text-align:center}
.small{font-size:14px;color:var(--muted);margin:6px 0}
.lvl{margin:0;color:var(--brand);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);background:#f2eff9;border-radius:99px;padding:3px 12px;font-size:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:26px;height:26px}
.iconbtn:hover{background:var(--brand-soft);color:var(--brand-deep)}
.iconbtn.sm{width:36px;height:36px}.iconbtn.sm svg{width:20px;height:20px}
.prog{flex:1;height:16px;background:#ece6fb;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;min-width:16px;background:var(--brand);border-radius:99px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 3px 0 rgba(255,255,255,.35);transition:width .35s}
.streak{display:flex;align-items:center;gap:3px;font-weight:700;color:#c9c2df;font-size:17px}
.streak svg{width:20px;height:20px}
.streak.hot{color:#ff8a4c}

/* buttons */
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,rgba(251,249,255,0));z-index:4}
.foot>*{max-width:524px;margin:0 auto}
.foot.two{display:flex;gap:10px;justify-content:center}
.foot.two>*{flex:1;max-width:257px;margin:0}
.btn{display:block;width:100%;border:0;border-radius:20px;padding:15px 18px;background:var(--brand);color:var(--brand-ink);font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:20px;letter-spacing:.01em;box-shadow:0 5px 0 var(--brand-shadow)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-shadow)}
.btn:disabled{background:#ebe7f6;color:#b3acc9;box-shadow:0 5px 0 #ddd7ee;cursor:default;transform:none}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok-deep)}
.btn.ghost{background:var(--surface);color:var(--brand-deep);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:disabled{color:var(--ok-deep);background:var(--ok-soft);border-color:#bfead2;box-shadow:0 5px 0 #bfead2}
.btn.small{width:auto;padding:9px 16px;font-size:16px;box-shadow:0 3px 0 var(--brand-shadow)}
.pill{display:inline-flex;align-items:center;gap:8px;border:2px solid #e3dcf8;background:var(--surface);border-radius:16px;padding:9px 18px;font-weight:700;font-size:17px;color:var(--brand-deep);box-shadow:0 3px 0 #e3dcf8}
.pill svg{width:22px;height:22px}
.listen{display:flex;gap:10px;margin:12px 0 14px}

/* home */
.home-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px}
.hi{font-size:46px;font-weight:800;color:var(--brand)}
.sub{margin:0;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:3px 12px}
.star-i{color:#ffc23d}
.legend-box{margin:12px 0 6px;padding:12px 14px;background:var(--surface);border-radius:20px;border:2px solid var(--line)}
.legend-box p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.resume{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid var(--brand);background:var(--brand-soft);border-radius:20px;padding:10px 12px;margin:12px 0 0}
.resume small{color:var(--muted)}
.unit{margin-top:28px}
.unit h2{font-size:28px;display:flex;flex-direction:column}
.unit h2 span{font-family:Nunito,sans-serif;font-size:13px;font-weight:700;color:var(--brand);letter-spacing:.06em;text-transform:uppercase}
.path{list-style:none;margin:8px 0 0;padding:0}
.node{margin:12px 0}
.node button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:4px;text-align:left;width:100%}
.off0 button{padding-left:0}.off1 button{padding-left:48px}.off2 button{padding-left:88px}.off3 button{padding-left:48px}
.bubble{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:4px solid #fff;box-shadow:0 0 0 3px var(--line),0 7px 0 3px var(--line);flex:none;transition:transform .12s}
.bubble svg{width:54px;height:54px}
.node.done .bubble{box-shadow:0 0 0 3px var(--brand),0 7px 0 3px var(--brand-shadow)}
.node.next .bubble{box-shadow:0 0 0 3px var(--brand),0 7px 0 3px var(--brand-shadow);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.node.next .bubble{animation:none}}
.lbl{display:flex;flex-direction:column;line-height:1.25}
.lbl small{color:var(--muted);font-size:13px}
.lbl b{font-weight:600;font-size:16px}
.stars i{font-style:normal;color:#e4def5;font-size:17px;letter-spacing:1px}
.stars i.on{color:#ffc23d}

/* cards */
.cards-head{margin:4px 0 0}
.cards-head h1{font-size:34px;font-weight:800;margin-top:4px}
.card{background:var(--surface);border-radius:28px;padding:18px;border:2px solid var(--line);margin:0 0 16px}
.card-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.num{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--brand);color:#fff;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px}
.card h2{font-size:28px;font-weight:800}
.card-vi{margin:2px 0 0;color:var(--muted);font-size:16px}
.card-ill{margin:0 0 14px;background:#f8f5ff;border-radius:22px;padding:14px}
.ill-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ill-row .tile{width:80px;height:80px;border-radius:22px}
.ill-wide{width:100%;height:auto;max-height:160px}
.formula{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.blk{background:#f5f1ff;border-radius:16px;padding:8px 14px;font-size:19px;line-height:1.7}
.blk.wide{flex:1 1 auto}
.plus{color:var(--muted);font-weight:700}
.exs{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:center;gap:12px}
.ex p{margin:0;font-size:20px;line-height:1.8}
.spk{flex:none;width:44px;height:44px;border-radius:14px;border:0;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center}
.spk svg{width:22px;height:22px}
.trap{margin:16px 0 0;padding:12px 16px;background:var(--warn-soft);border-radius:20px}
.trap b{font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--warn-deep);font-size:18px}
.trap p{margin:2px 0 0;font-size:16px}
.prepgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.prepgrid figure{margin:0;text-align:center;border-radius:16px;padding:4px 2px 6px}
.prepgrid svg{width:100%;height:auto}
.prepgrid figcaption{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.freq{display:flex;flex-direction:column;gap:7px}
.freq-row{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:8px}
.freq-row .g{justify-self:start;padding:2px 10px}
.fdots{display:flex;gap:6px}
.fdots i{width:20px;height:20px;border-radius:50%;background:#e9e3fa}
.fdots i.on{background:var(--a-ink)}
.freq .pct{font-size:14px;color:var(--muted);text-align:right}
.swap{display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1.8}
.swap svg{width:120px;height:30px}

/* intro */
.intro{text-align:center;padding:24px 0}
.intro-art{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:10px 0 20px}
.intro .lvl{justify-content:center}
.intro h2{font-size:50px;font-weight:800;color:var(--brand)}
.intro-vi{max-width:30ch;margin:8px auto;font-size:17px}
.intro-n{color:var(--muted)}
.eyebrow{margin:0;color:var(--brand);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}

/* question */
.qcard{padding:4px 0}
.qhead{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:6px 0 18px}
.prompt{font-size:28px;font-weight:800;margin-top:6px}
.qline{font-size:23px;line-height:2.1;margin:6px 0 18px}
.qline.big{font-size:24px;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px}
.cue{color:var(--muted);font-size:.78em}
.blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--brand);text-align:center;font-weight:700;line-height:1.3}
.blank.filled{color:var(--ok-deep);border-bottom-color:var(--ok);background:var(--ok-soft);border-radius:8px 8px 0 0;padding:0 8px}
.dialog{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
.bub{display:flex;gap:10px;align-items:baseline;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 16px;font-size:21px;line-height:2;max-width:94%}
.bub.b{align-self:flex-end;background:var(--brand-soft);border-color:transparent}
.bub b{font-family:"Baloo 2",sans-serif;color:var(--brand);font-size:19px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts.chips{flex-direction:row;flex-wrap:wrap}
.opts.two{flex-direction:row}.opts.two .opt{flex:1;justify-content:center}
.opt{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid #e8e2f7;background:var(--surface);border-radius:22px;padding:13px 22px;font-size:21px;font-weight:500;color:var(--ink);box-shadow:0 5px 0 #e8e2f7}
.opt svg{width:22px;height:22px}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #e8e2f7}
.opt.right,.word.right{border:3px solid var(--ok);background:var(--ok-soft);color:var(--ok-deep);box-shadow:0 5px 0 var(--ok);font-weight:600}
.opt.wrong,.word.wrong{border-style:dashed;border-color:var(--warn);color:var(--warn-deep);opacity:.6;text-decoration:line-through;box-shadow:none}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){color:#a7a1bf}
.words{display:flex;flex-wrap:wrap;gap:10px;font-size:22px;margin:8px 0}
.word{border:2px solid #e8e2f7;background:var(--surface);border-radius:16px;padding:8px 14px;box-shadow:0 4px 0 #e8e2f7}
.word:not(:disabled):hover{border-color:var(--brand)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match>div{display:flex;flex-direction:column;gap:10px}
.mt{border:2px solid #e8e2f7;background:var(--surface);border-radius:18px;padding:12px 10px;font-size:18px;min-height:54px;box-shadow:0 4px 0 #e8e2f7}
.mt.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 0 var(--brand)}
.mt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-deep);box-shadow:none}
.mt.bad{border-style:dashed;border-color:var(--warn);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mt.bad{animation:none}}
.gapin{font:inherit;font-size:21px;font-weight:700;color:var(--brand-deep);background:#f6f2ff;border:0;border-bottom:3px solid var(--brand);border-radius:10px 10px 0 0;padding:0 6px;text-align:center;max-width:100%}
.gapin.bad{border-bottom-style:dashed;border-bottom-color:var(--warn);background:var(--warn-soft);color:var(--warn-deep)}
.gapin.shown{background:var(--ok-soft);color:var(--ok-deep);border-bottom-color:var(--ok)}
.forms{display:flex;flex-direction:column;gap:10px;font-size:21px}
.frm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 14px}
.frm .arr{color:var(--muted)}
.answer-line{min-height:66px;border-bottom:3px solid #ece6fb;display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center}
.answer-line.bad{border-bottom:3px dashed var(--warn)}
.ph{color:var(--muted);font-size:15px}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.tl{border:2px solid #e8e2f7;background:var(--surface);border-radius:16px;padding:8px 16px;font-size:20px;font-weight:500;box-shadow:0 4px 0 #e8e2f7}
.tl.in{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 4px 0 #cfc2ff}
.src{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--brand);border-radius:18px;padding:12px 16px;font-size:21px;margin:0 0 12px}
.wr{width:100%;font:inherit;font-size:21px;border:2px solid #e3dcf8;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 14px;resize:none}
.wr:focus{border-color:var(--brand);outline:none}
.wr.bad{border-style:dashed;border-color:var(--warn)}

/* feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -12px 30px rgba(60,40,140,.10);max-height:78vh;overflow:auto;animation:up .22s ease-out}
.sheet>*{max-width:524px;margin-left:auto;margin-right:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet.good{border-top:6px solid var(--ok)}
.sheet.reveal,.sheet.hint{border-top:6px solid var(--warn)}
.sh-t{display:flex;align-items:center;gap:10px;font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:800;margin:0 auto 8px}
.good .sh-t{color:var(--ok-deep)} .reveal .sh-t,.hint .sh-t{color:var(--warn-deep)}
.sh-t svg{width:30px;height:30px}
.sh-h{font-size:18px;margin:4px auto 14px}
.sh-say{font-size:23px;line-height:1.9;margin:6px auto}
.sh-ex{font-size:17px;color:var(--ink);margin:4px auto 2px}
.pairs{list-style:none;padding:0;margin:6px auto;display:flex;flex-direction:column;gap:4px;font-size:18px}
.pairs span{color:var(--muted)}

/* speaking */
.sp-sentence{font-size:25px;line-height:2.3;margin:10px 0 14px}
.slot{display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:700;color:var(--brand-deep);background:#f4f0ff;border:3px solid var(--brand);border-radius:16px;padding:0 12px;margin:2px 0;line-height:1.7;box-shadow:0 4px 0 #cfc2ff;cursor:pointer}
.slot svg{width:18px;height:18px;opacity:.75}
.slot:active{transform:translateY(2px);box-shadow:0 2px 0 #cfc2ff}
.sp-colored{font-size:22px;line-height:2;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 18px}
.rdots{display:flex;gap:12px;margin:6px 0 14px}
.rdots i{width:30px;height:30px;border-radius:50%;background:#ece6fb}
.rdots i.on{background:var(--ok)}
.own{display:block;margin-top:18px}
.own b{display:block;font-weight:600;font-size:16px;margin-bottom:8px}
.own textarea{width:100%;font:inherit;font-size:19px;border:2px solid #e3dcf8;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 14px;resize:none}
.own textarea:focus{border-color:var(--brand);outline:none}

/* result */
.result{text-align:center;padding:10px 0}
.result h2{font-size:44px;font-weight:800;color:var(--brand);margin:6px 0}
.bigstars .stars i{font-size:52px}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.lvls div{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column}
.lvls b{font-family:"Baloo 2",sans-serif;font-size:28px;color:var(--brand-deep)}
.lvls span{font-size:13px;color:var(--muted)}
.lvls.sm b{font-size:21px}
.result h3{font-size:26px;text-align:left;margin:18px 0 8px}
.review{list-style:none;padding:0;margin:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.review li{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px 52px 8px 14px;position:relative}
.review .iconbtn{position:absolute;right:6px;top:8px}
.allright{font-weight:600;color:var(--ok-deep)}
.submit-box{margin:20px 0 10px}
.ok-msg{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:600;color:var(--ok-deep)}
.ok-msg svg{width:22px;height:22px}
.err{color:var(--warn-deep);font-size:15px}

.t0.t0{background:var(--t0)}.t1.t1{background:var(--t1)}.t2.t2{background:var(--t2)}.t3.t3{background:var(--t3)}.t4.t4{background:var(--t4)}.t5.t5{background:var(--t5)}
@media (max-width:380px){.hi{font-size:40px}.off2 button{padding-left:64px}.prompt{font-size:24px}.qline{font-size:20px}.tile.qbig{width:96px;height:84px}.tile.qbig svg{width:62px;height:62px}.lgrid{gap:8px}}
/* unit progress + send box */
.unit-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.uprog{flex:none;font-size:14px;font-weight:800;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:2px 12px;margin-bottom:4px}
.uprog.full{color:var(--ok-deep);border-color:#bfead2;background:var(--ok-soft)}
.usend{margin:16px 0 4px;padding:14px 16px;border-radius:22px;border:2px dashed var(--line);background:var(--surface);text-align:left}
.usend .us-t{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;font-size:20px;color:var(--muted)}
.usend .us-t svg{width:22px;height:22px;flex:none}
.usend .us-p{margin:0 0 10px;font-size:15px}
.usend .us-left{margin:0;font-size:14px;color:var(--muted)}
.usend.locked .us-p{margin:0 0 4px;color:var(--muted)}
.usend.ready{border:2px solid var(--ok);background:var(--ok-soft)}
.usend.ready .us-t{color:var(--ok-deep)}
.usend.sent{border:2px solid #bfead2;background:var(--surface)}
.usend.sent .us-t{color:var(--ok-deep)}
.usend.sent .us-p{margin:0;color:var(--muted)}
.usend.warn{border:2px solid var(--warn);background:var(--warn-soft)}
.usend.warn .us-t{color:var(--warn-deep)}
.usend.warn .btn{display:flex;align-items:center;gap:6px;margin:8px 0 0}
.usend.warn .btn svg{width:18px;height:18px}
.us-msg{font-size:14px;color:var(--muted);margin:8px 0 0}
.usend .err,.usend .ok-msg{margin:10px 0 0}
.submit-box{margin:22px 0 10px}

/* speaking: steps + recorder */
.steps{margin:4px 0 6px;padding-left:22px;color:var(--muted);font-size:15px}
.steps li{margin:2px 0}
.rec{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 16px 14px;margin:6px 0 4px;text-align:center}
.rec-t{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 8px;font-weight:800;font-size:17px;color:var(--ink)}
.rec-t svg{width:20px;height:20px;color:var(--ok-deep)}
.rec-t span{color:var(--muted);font-weight:600}
.rec-t.live{color:#d93a40}
.rdot{width:12px;height:12px;border-radius:50%;background:#e5484d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.recbtn{width:88px;height:88px;border-radius:50%;border:0;background:var(--warn);color:#fff;display:grid;place-items:center;margin:6px auto 10px;box-shadow:0 6px 0 var(--warn-deep)}
.recbtn svg{width:40px;height:40px}
.recbtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--warn-deep)}
.recbtn.on{background:#e5484d;box-shadow:0 6px 0 #b8323a;animation:recp 1.4s ease-out infinite}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45),0 6px 0 #b8323a}80%{box-shadow:0 0 0 18px rgba(229,72,77,0),0 6px 0 #b8323a}100%{box-shadow:0 0 0 0 rgba(229,72,77,0),0 6px 0 #b8323a}}
@media (prefers-reduced-motion:reduce){.recbtn.on,.rdot{animation:none}}
.rectime{font-family:"Baloo 2",Nunito,sans-serif;font-size:28px;font-weight:800;color:#d93a40}
.recbar{height:8px;background:#ece6fb;border-radius:99px;overflow:hidden;margin:6px 0 8px}
.recbar i{display:block;height:100%;width:0;background:#e5484d;border-radius:99px;transition:width .25s linear}
.rec audio{width:100%;margin:2px 0 6px}
.rec .btn.small{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.rec .btn.small svg{width:18px;height:18px}
.rec .err{margin:8px 0 0}
.slot:disabled{opacity:.5;cursor:default}
.tile .spark{pointer-events:none}
.ill-row .tile .spark.s1{width:7px;height:7px;top:9px;right:10px}
</style>
